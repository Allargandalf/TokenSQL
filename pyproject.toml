[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tokensql"
version = "0.1.0"
description = "Traceable token pricing ingestion, normalization, and comparison service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "openpyxl>=3.1,<4.0",
  "rapidfuzz>=3.9,<4.0",
  "httpx>=0.27,<1.0",
  "tenacity>=8.2,<10.0",
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
]
ui = ["streamlit>=1.36,<2.0"]

[project.scripts]
tokensql = "tokensql.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tokensql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["tokensql"]
