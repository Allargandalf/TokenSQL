[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tokensql"
version = "2.2.0"
description = "File-and-prompt quote workspace maintained by OpenCode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "xlrd>=2.0.1,<3.0",
  "httpx>=0.27,<1.0",
  "fastapi>=0.111,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "tomli>=2.0,<3.0; python_version < '3.11'",
]
browser = ["playwright>=1.49,<2.0"]

[project.scripts]
tokensql = "tokensql.workspace.runtime:main"
tokensql-quotes = "tokensql.workspace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokensql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["tokensql"]
